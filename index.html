<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="referrer" content="no-referrer">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Bottega CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: barra grafite a sinistra con le sette aree, piano di lavoro grigio chiaro a destra; azioni in viola, grafici e indicatori sfumati viola/grigio. Su telefono il banco diventa una barra in alto. */
:root {
  --bg: #F1F0F4; --surface: #FFFFFF; --sunken: #E6E4EC; --line: #D4D1DD;
  --fg: #1C1A22; --muted: #63606E;
  --accent: #5B3FA8; --accent-fg: #FFFFFF; --accent-soft: #ECE6FA;
  --pos: #2D6B3F; --pos-soft: #DCEBDF;
  --neg: #C0352B; --neg-soft: #F9E0DC;
  --warn: #946300; --warn-soft: #F6EBCF;
  --side-bg: #2B2833; --side-fg: #ECEAF2; --side-muted: #A39FB0; --side-hover: #3A3644; --side-active: #45385F; --brass: #C2AEF5;
  --g-in-a: #A48BEB; --g-in-b: #4A2E96; --g-out-a: #C9C6D1; --g-out-b: #75717F;
  --shadow: 0 1px 2px rgba(31,27,23,.06), 0 8px 24px rgba(31,27,23,.07);
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141319; --surface: #1D1B24; --sunken: #0F0E13; --line: #312E3B;
  --fg: #ECEAF2; --muted: #A19DAE;
  --accent: #B39CF5; --accent-fg: #1C1233; --accent-soft: #2E2547;
  --pos: #74C08A; --pos-soft: #1A2D1F;
  --neg: #F28E80; --neg-soft: #3E1C17;
  --warn: #E5B34F; --warn-soft: #382A12;
  --side-bg: #0E0D12; --side-fg: #ECEAF2; --side-muted: #9B97A8; --side-hover: #1F1D27; --side-active: #2F2648; --brass: #C2AEF5;
  --g-in-a: #CDBDF8; --g-in-b: #6E4FD0; --g-out-a: #9C98A8; --g-out-b: #4E4B58;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141319; --surface: #1D1B24; --sunken: #0F0E13; --line: #312E3B;
  --fg: #ECEAF2; --muted: #A19DAE;
  --accent: #B39CF5; --accent-fg: #1C1233; --accent-soft: #2E2547;
  --pos: #74C08A; --pos-soft: #1A2D1F;
  --neg: #F28E80; --neg-soft: #3E1C17;
  --warn: #E5B34F; --warn-soft: #382A12;
  --side-bg: #0E0D12; --side-fg: #ECEAF2; --side-muted: #9B97A8; --side-hover: #1F1D27; --side-active: #2F2648; --brass: #C2AEF5;
  --g-in-a: #CDBDF8; --g-in-b: #6E4FD0; --g-out-a: #9C98A8; --g-out-b: #4E4B58;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: -0.005em; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
a.more { font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 600; }

.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side-bg); color: var(--side-fg); padding: 22px 14px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--brass); color: var(--brass); display: grid; place-items: center; font-family: var(--f-display); font-size: 17px; flex: none; }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: 17px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; font-family: var(--f-body); font-size: 10px; color: var(--side-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; margin-top: 2px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-sep { height: 1px; background: var(--side-hover); margin: 8px 10px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--side-muted); text-decoration: none; font-weight: 500; border-left: 2px solid transparent; }
.nav a:hover { background: var(--side-hover); color: var(--side-fg); }
.nav a[aria-current="page"] { background: var(--side-active); color: var(--side-fg); border-left-color: var(--brass); border-radius: 2px 8px 8px 2px; }
.nav a[aria-current="page"] svg { color: var(--brass); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .badge { margin-left: auto; font-size: 11px; font-family: var(--f-mono); background: var(--brass); color: var(--side-bg); border-radius: 999px; padding: 0 7px; font-style: normal; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 8px; font-size: 12px; color: var(--side-muted); }
.side-foot .btn { background: transparent; color: var(--side-fg); border-color: var(--side-hover); }
.side-foot .btn:hover { border-color: var(--brass); }
.mode { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--pos); }

main { min-width: 0; padding-block: 24px 48px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.head h1 { font-size: 30px; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--neg); }
.btn.armed { background: var(--neg); color: var(--surface); border-color: var(--neg); }
.btn.small { padding: 3px 9px; font-size: 12px; border-radius: 6px; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--fg); background: var(--sunken); }

.notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpis.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi .v { font-family: var(--f-display); font-size: 25px; font-weight: 400; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.panel-h h2 { font-size: 17px; }
.panel .hint { font-size: 12px; color: var(--muted); margin: -4px 0 0; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.chart .grid { stroke: var(--line); }

.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; cursor: pointer; }
.row:first-child { border-top: 0; }
.row:hover .t { color: var(--accent); }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { font-size: 12px; color: var(--muted); }
.row .r { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.none { font-size: 13px; color: var(--muted); margin: 0; }

.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.pill.pos { background: var(--pos-soft); color: var(--pos); }
.pill.neg { background: var(--neg-soft); color: var(--neg); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.mut { background: var(--sunken); color: var(--muted); }
.pos-t { color: var(--pos); } .neg-t { color: var(--neg); } .warn-t { color: var(--warn); }

.board-wrap { overflow-x: auto; margin-inline: -4px; padding: 4px; }
.board { display: grid; grid-template-columns: repeat(6, minmax(224px, 1fr)); gap: 12px; min-width: min-content; }
.col { background: var(--sunken); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 260px; outline: 2px dashed transparent; outline-offset: -2px; transition: outline-color .15s; }
.col.over { outline-color: var(--accent); }
.col-h { display: flex; flex-direction: column; gap: 2px; padding: 2px 4px 6px; }
.col-h .n { display: flex; justify-content: space-between; font-weight: 600; }
.col-h .n span { color: var(--muted); font-weight: 500; }
.col-h .sum { font-size: 12px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: grab; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); }
.card:hover { border-color: var(--accent); }
.card.drag { opacity: .4; }
.card .t { font-weight: 600; }
.card .m { font-size: 12px; color: var(--muted); }
.card .f { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; flex-wrap: wrap; }
.meter { height: 5px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--g-in-a), var(--g-in-b)); border-radius: 3px; }
.meter.over i { background: linear-gradient(90deg, var(--neg-soft), var(--neg)); }
.legend i.g-in { background: linear-gradient(180deg, var(--g-in-a), var(--g-in-b)); }
.legend i.g-out { background: linear-gradient(180deg, var(--g-out-a), var(--g-out-b)); }
.chart .s-in-a { stop-color: var(--g-in-a); } .chart .s-in-b { stop-color: var(--g-in-b); }
.chart .s-out-a { stop-color: var(--g-out-a); } .chart .s-out-b { stop-color: var(--g-out-b); }
.kpi { background: linear-gradient(160deg, var(--surface) 55%, var(--accent-soft)); }
.col-empty { font-size: 12px; color: var(--muted); padding: 8px 4px; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar input, .toolbar select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; }
.toolbar input { min-width: 0; flex: 1 1 200px; max-width: 320px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; min-width: 680px; }
th, td { text-align: left; padding: 10px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
thead th { border-top: 0; background: var(--sunken); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; white-space: nowrap; }
tbody tr[data-edit] { cursor: pointer; }
tbody tr[data-edit]:hover td { background: var(--bg); }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td .sub { display: block; font-size: 12px; color: var(--muted); }
.stock { display: flex; align-items: center; gap: 10px; }
.stock .meter { width: 80px; flex: none; }
.stepper { display: inline-flex; gap: 4px; }

.quote { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.qrows { display: flex; flex-direction: column; gap: 8px; }
.qrow { display: grid; grid-template-columns: minmax(0, 1fr) 92px 110px 32px; gap: 8px; align-items: center; }
.qrow .num { text-align: right; font-size: 13px; }
.receipt { position: sticky; top: 16px; }
.receipt dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; margin: 0; }
.receipt dt { color: var(--muted); }
.receipt dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.receipt .rule { grid-column: 1 / -1; border-top: 1px dashed var(--line); }
.receipt .big { font-family: var(--f-display); font-size: 32px; font-weight: 400; color: var(--accent); }
.receipt .strong { color: var(--fg); font-weight: 600; }

.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 28px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty b { color: var(--fg); font-family: var(--f-display); font-size: 17px; }

dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); padding: 0; width: min(540px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10,12,18,.45); }
.dlg { display: flex; flex-direction: column; gap: 14px; padding: 20px; max-height: calc(100vh - 64px); overflow-y: auto; }
.dlg h2 { font-size: 20px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.field textarea { min-height: 72px; resize: vertical; }
.field .help { font-size: 11px; color: var(--muted); }
.dlg-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.related { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 500; z-index: 50; max-width: calc(100vw - 32px); }

@media (max-width: 1180px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid2, .grid3, .quote { grid-template-columns: minmax(0, 1fr); } .receipt { position: static; } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 5; flex-direction: row; align-items: center; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 12px; overflow-x: auto; }
  .nav a[aria-current="page"] { border-left-color: transparent; border-radius: 8px; box-shadow: inset 0 -2px 0 var(--brass); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--side-bg); }
  .brand b, .side-foot, .nav-sep, .nav .badge { display: none; }
  .brand { padding: 0; flex: none; }
  .nav { flex-direction: row; flex: none; gap: 0; }
  .nav a { padding: 8px 10px; white-space: nowrap; flex: none; }
  .side { gap: 8px; scrollbar-width: none; }
  .kpis > .kpi:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .row .r { max-width: 55%; }
  .row .r .pill { white-space: normal; text-align: right; line-height: 1.3; }
  .head > div:first-child { min-width: 0; }
  .card .f { gap: 6px; }
  .seg { width: 100%; }
  .seg button { flex: 1 1 auto; padding: 7px 8px; }
  .toolbar input, .toolbar select { max-width: none; width: 100%; flex: 1 1 100%; }
  .dlg { padding: 16px; }
  .dlg-foot .actions { width: 100%; justify-content: flex-end; }
  .board { grid-template-columns: repeat(6, minmax(78vw, 1fr)); }
  .board-wrap { scroll-snap-type: x mandatory; }
  .col { scroll-snap-align: start; }
  .receipt .big { font-size: 28px; }
  .nav a span { display: none; }
  .nav a[aria-current="page"] span { display: inline; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; }
  .head h1 { font-size: 24px; }
  .kpis, .kpis.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fields { grid-template-columns: minmax(0, 1fr); }
  .qrow { grid-template-columns: minmax(0, 1fr) 72px 32px; }
  .qrow .num { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

/* ---------- Archiviazione ---------- */
function dbStore(db) {
  return {
    mode: "db",
    start() {
      COLS.forEach(col => db.collection(col).onSnapshot(snap => {
        state[col] = new Map(snap.docs.map(d => [d.id, d.data()]));
        loaded.add(col); render();
      }, () => toast("Connessione ai dati interrotta. Ricarica la pagina.")));
    },
    add: (col, data) => db.collection(col).add(data),
    set: (col, id, data) => db.collection(col).doc(id).set(data),
    update: (col, id, data) => db.collection(col).doc(id).update(data),
    remove: (col, id) => db.collection(col).doc(id).delete(),
  };
}
function localStore() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem("bottega-crm") || "null"); } catch (e) {}
  if (!data || typeof data !== "object" || Array.isArray(data)) data = JSON.parse(JSON.stringify(DEMO));
  COLS.forEach(c => { if (!data[c] || typeof data[c] !== "object") data[c] = {}; });
  const save = () => { try { localStorage.setItem("bottega-crm", JSON.stringify(data)); } catch (e) {} };
  const emit = col => { state[col] = new Map(Object.entries(data[col])); loaded.add(col); render(); };
  return {
    mode: "local",
    start() { COLS.forEach(emit); },
    async add(col, d) { const id = uid(); data[col][id] = d; save(); emit(col); return { id }; },
    async set(col, id, d) { data[col][id] = d; save(); emit(col); },
    async update(col, id, d) { data[col][id] = { ...data[col][id], ...d }; save(); emit(col); },
    async remove(col, id) { delete data[col][id]; save(); emit(col); },
  };
}
async function write(fn, okMsg) {
  if (!store) return false;
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    if (e && e.code === "invalid_argument") { canWrite = false; render(); toast("Non hai il permesso di modificare questi dati."); }
    else if (e && e.code === "quota_exceeded") toast("Spazio esaurito: elimina qualche record e riprova.");
    else toast("Salvataggio non riuscito. Riprova tra poco.");
    return false;
  }
}

/* ---------- Calcoli ---------- */
function orderEconomics(o) {
  const rate = cfg().rate;
  const cost = n(o.materialsCost) + n(o.hoursDone) * rate;
  const margin = n(o.price) - cost;
  return { cost, margin, pct: n(o.price) ? margin / n(o.price) : null, due: Math.max(0, n(o.price) - n(o.deposit) - n(o.paidBalance)) };
}
function lowStock() { return all("materials").filter(m => n(m.qty) <= n(m.minQty)); }
function lastPurchase(cid) {
  const dates = [
    ...all("transactions").filter(t => t.contactId === cid && t.type === "entrata").map(t => t.date),
    ...all("orders").filter(o => o.contactId === cid).map(o => o.dueDate || (o.createdAt || "").slice(0, 10)),
  ].filter(Boolean).sort();
  return dates.length ? dates[dates.length - 1] : null;
}
function nextAnniversary(iso) {
  if (!iso) return null;
  const t = todayISO(), y = +t.slice(0, 4);
  let cand = `${y}-${iso.slice(5)}`; if (cand < t) cand = `${y + 1}-${iso.slice(5)}`;
  return daysUntil(cand);
}
function relationshipAlerts() {
  const out = []; const lim = cfg().recontactDays;
  for (const c of all("contacts")) {
    if (c.status === "inattivo") continue;
    const ann = nextAnniversary(c.special);
    if (ann != null && ann <= 21) out.push({ c, sort: ann, why: ann === 0 ? `${c.specialLabel || "Ricorrenza"} oggi` : `${c.specialLabel || "Ricorrenza"} tra ${ann} g`, cls: "acc" });
    if (c.status === "cliente" || c.status === "abituale") {
      const lp = lastPurchase(c.id);
      if (lp) { const ago = -daysUntil(lp); if (ago >= lim) out.push({ c, sort: 100 + (400 - Math.min(ago, 400)), why: `ultimo lavoro ${Math.round(ago / 30)} mesi fa`, cls: "warn" }); }
    }
  }
  return out.sort((a, b) => a.sort - b.sort);
}
function metrics() {
  const deals = all("deals"), tx = all("transactions"), orders = all("orders");
  const open = deals.filter(dealOpen);
  const paid = tx.filter(t => t.status === "pagato");
  const inc = paid.filter(t => t.type === "entrata").reduce((s, t) => s + n(t.amount), 0);
  const out = paid.filter(t => t.type === "uscita").reduce((s, t) => s + n(t.amount), 0);
  const active = orders.filter(orderOpen);
  const delivered = orders.filter(o => o.stage === "consegnato" && n(o.price) > 0);
  const totPrice = delivered.reduce((s, o) => s + n(o.price), 0);
  const totMargin = delivered.reduce((s, o) => s + orderEconomics(o).margin, 0);
  const invoices = tx.filter(t => t.type === "entrata" && t.status === "in attesa").reduce((s, t) => s + n(t.amount), 0);
  const balances = orders.filter(o => !o.settled).reduce((s, o) => s + orderEconomics(o).due, 0);
  return {
    openValue: open.reduce((s, d) => s + n(d.value), 0), openCount: open.length,
    weighted: open.reduce((s, d) => s + n(d.value) * dstage(d.stage).p, 0),
    activeCount: active.length, activeValue: active.reduce((s, o) => s + n(o.price), 0),
    balance: inc - out, receivable: invoices + balances,
    avgMargin: totPrice ? totMargin / totPrice : null, deliveredCount: delivered.length,
  };
}
function lastMonths(k) {
  const out = []; const d = new Date();
  for (let i = k - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(`${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}`); }
  return out;
}

/* ---------- Pezzi comuni ---------- */
function head(title, sub, buttons = "") {
  return `<div class="head"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${buttons}</div></div>`;
}
const addBtn = (col, label) => canWrite ? `<button type="button" class="btn primary" data-new="${col}">+ ${label}</button>` : "";
const kpi = (l, v, s, cls = "") => `<div class="kpi"><span class="label">${l}</span><span class="v ${cls}">${v}</span><span class="s">${s}</span></div>`;
function exampleNotice() { return ""; }
function marginPill(pct) {
  if (pct == null) return "";
  const cls = pct < 0 ? "neg" : pct < 0.2 ? "warn" : "pos";
  return `<span class="pill ${cls}">margine ${Math.round(pct * 100)}%</span>`;
}

/* ---------- Panoramica ---------- */
function viewOverview() {
  const m = metrics();
  const series = lastMonths(6).map(k => {
    const tx = all("transactions").filter(t => t.status === "pagato" && (t.date || "").startsWith(k));
    return { k, inc: tx.filter(t => t.type === "entrata").reduce((s, t) => s + n(t.amount), 0), out: tx.filter(t => t.type === "uscita").reduce((s, t) => s + n(t.amount), 0) };
  });
  const deliveries = all("orders").filter(o => orderOpen(o) && o.dueDate && daysUntil(o.dueDate) <= 21).sort((a, b) => a.dueDate.localeCompare(b.dueDate)).slice(0, 6);
  const alerts = relationshipAlerts().slice(0, 6);
  const low = lowStock().slice(0, 6);
  const recent = all("transactions").sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 5);
  return head(`Buongiorno, ${esc(cfg().name)}`, "Cosa c'è sul banco, cosa consegnare e chi sentire questa settimana.", addBtn("deals", "Richiesta")) + exampleNotice() + `
  <div class="kpis">
    ${kpi("Richieste aperte", eur.format(m.openValue), `${m.openCount} in corso · ponderato ${eur.format(m.weighted)}`)}
    ${kpi("In laboratorio", String(m.activeCount), `commesse attive · ${eur.format(m.activeValue)}`)}
    ${kpi("Margine reale medio", m.avgMargin == null ? "—" : Math.round(m.avgMargin * 100) + "%", m.deliveredCount ? `su ${m.deliveredCount} lavori consegnati` : "compare dopo la prima consegna", m.avgMargin != null && m.avgMargin < 0.2 ? "warn-t" : "")}
    ${kpi("Saldo di cassa", eur.format(m.balance), "incassi − spese pagate", m.balance < 0 ? "neg-t" : "")}
    ${kpi("Da incassare", eur.format(m.receivable), "fatture aperte e saldi commesse")}
  </div>
  <div class="grid2">
    <section class="panel">
      <div class="panel-h"><h2>Incassi e spese, ultimi 6 mesi</h2><div class="legend"><span><i class="g-in"></i>Incassi</span><span><i class="g-out"></i>Spese</span></div></div>
      <div class="chart">${barChart(series)}</div>
    </section>
    <section class="panel">
      <div class="panel-h"><h2>Consegne in arrivo</h2><a href="#laboratorio" class="more">Laboratorio →</a></div>
      ${deliveries.length ? `<div class="list">${deliveries.map(o => {

function txRow(t) {
  const cls = t.type === "entrata" ? "pos-t" : "neg-t";
  return `<div class="row" data-edit="transactions" data-id="${esc(t.id)}"><div><div class="t">${esc(t.description)}</div><div class="m">${fmtDay(t.date)} · ${esc(t.category || "Altro")}</div></div><div class="r"><span class="num ${cls}">${t.type === "entrata" ? "+" : "−"}${eur.format(n(t.amount))}</span>${t.status === "pagato" ? "" : `<span class="pill warn">in attesa</span>`}</div></div>`;
}
function barChart(series) {
  const W = 560, H = 220, L = 52, B = 26, T = 10, R = 8;
  const max = Math.max(1, ...series.flatMap(s => [s.inc, s.out]));
  const step = niceStep(max / 4); const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const gw = (W - L - R) / series.length, bw = Math.min(22, gw * 0.3);
  let g = `<defs><linearGradient id="gIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-in-a"/><stop offset="1" class="s-in-b"/></linearGradient><linearGradient id="gOut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="s-out-a"/><stop offset="1" class="s-out-b"/></linearGradient></defs>`;
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${compact(v)}</text>`;
  series.forEach((s, i) => {
    const cx = L + gw * i + gw / 2;
    g += `<rect x="${cx - bw - 2}" y="${y(s.inc)}" width="${bw}" height="${y(0) - y(s.inc)}" rx="3" fill="url(#gIn)"><title>Incassi ${eur.format(s.inc)}</title></rect>`;
    g += `<rect x="${cx + 2}" y="${y(s.out)}" width="${bw}" height="${y(0) - y(s.out)}" rx="3" fill="url(#gOut)"><title>Spese ${eur.format(s.out)}</title></rect>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${MONTHS[+s.k.slice(5) - 1]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Incassi e spese mensili">${g}</svg>`;
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function compact(v) { return v >= 1000 ? (v / 1000).toLocaleString("it-IT", { maximumFractionDigits: 1 }) + "k" : String(v); }

/* ---------- Preventivatore ---------- */
function freshQuote() {
  const c = cfg();
  return { title: "", contactId: "", rows: [{ mat: "", q: 1 }], extra: 0, hours: 8, rate: c.rate, overhead: c.overhead, margin: c.margin, vat: c.vat };
}
function quoteCalc(q) {
  const mats = q.rows.reduce((s, r) => { const m = state.materials.get(r.mat); return s + (m ? n(m.cost) * n(r.q) : 0); }, 0) + n(q.extra);
  const labour = n(q.hours) * n(q.rate);
  const overhead = (mats + labour) * n(q.overhead) / 100;
  const cost = mats + labour + overhead;
  const net = cost * (1 + n(q.margin) / 100);
  const vat = net * n(q.vat) / 100;
  return { mats, labour, overhead, cost, profit: net - cost, net, vat, total: net + vat };
}

    <div class="seg">${seg}</div>
  </div>
  ${tx.length === 0 ? `<div class="empty"><b>Ancora nessun movimento</b><span>Registra vendite, acconti e spese per vedere il saldo della bottega.</span>${addBtn("transactions", "Movimento")}</div>` : `
  <div class="table-wrap"><table><thead><tr><th>Data</th><th>Descrizione</th><th>Categoria</th><th>Stato</th><th class="n">Importo</th>${canWrite ? "<th></th>" : ""}</tr></thead><tbody>
    ${list.map(t => `<tr data-edit="transactions" data-id="${esc(t.id)}">
      <td class="num">${fmtDate(t.date)}</td>
      <td><b>${esc(t.description)}</b><span class="sub">${esc(contactName(t.contactId))}</span></td>
      <td>${esc(t.category || "Altro")}</td>
      <td>${t.status === "pagato" ? `<span class="pill pos">${t.type === "entrata" ? "incassato" : "pagato"}</span>` : `<span class="pill warn">in attesa</span>`}</td>
      <td class="n ${t.type === "entrata" ? "pos-t" : "neg-t"}">${t.type === "entrata" ? "+" : "−"}${eur2.format(n(t.amount))}</td>
      ${canWrite ? `<td>${t.status !== "pagato" ? `<button type="button" class="btn small" data-markpaid="${esc(t.id)}">Segna ${t.type === "entrata" ? "incassato" : "pagato"}</button>` : ""}</td>` : ""}
    </tr>`).join("") || `<tr><td colspan="6" class="muted">Nessun movimento con questi filtri.</td></tr>`}
  </tbody></table></div>`}`;
}

/* ---------- Render ---------- */
function render() {
  document.querySelectorAll("#nav a").forEach(a => { if (a.dataset.view === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const c = cfg();
  document.getElementById("brandName").textContent = c.name;
  document.getElementById("brandMark").textContent = (c.name.replace(/^(la|il|lo|l')\s*/i, "")[0] || "B").toUpperCase();
  const lb = document.getElementById("labBadge"), sb = document.getElementById("stockBadge");
  const lateOrders = all("orders").filter(o => orderOpen(o) && o.stage !== "pronto" && o.dueDate && daysUntil(o.dueDate) < 0).length;
  lb.hidden = !lateOrders; lb.textContent = lateOrders; lb.title = `${lateOrders} in ritardo`;
  const low = lowStock().length; sb.hidden = !low; sb.textContent = low; sb.title = `${low} da riordinare`;
  const main = document.getElementById("main");
  if (loaded.size < COLS.length) {
    main.innerHTML = head(VIEWS[view], "Apro il registro…") + `<div class="empty"><b>Sto aprendo il registro di bottega</b><span>Richieste, commesse, materiali, clienti e movimenti compariranno qui.</span></div>`;
    return;
  }
  const ae = document.activeElement; const focusId = ae && ae.id && main.contains(ae) ? ae.id : null;
  let caret = null; try { caret = focusId ? ae.selectionStart : null; } catch (e) {}
  main.innerHTML = { panoramica: viewOverview, richieste: viewDeals, preventivi: viewQuote, laboratorio: viewOrders, magazzino: viewMaterials, clienti: viewContacts, cassa: viewFinance }[view]();
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { if (caret != null) el.setSelectionRange(caret, caret); } catch (e) {} } }
}

/* ---------- Moduli ---------- */

    { k: "source", l: "Come ci ha conosciuto", t: "list", opts: () => ["Passaparola", "Vetrina", "Instagram", "Fiera / mercatino", "Sito web", "Architetto o arredatore"] },
    { k: "specialLabel", l: "Ricorrenza", t: "list", opts: () => ["Compleanno", "Anniversario di matrimonio", "Inaugurazione casa", "Primo acquisto"], help: "Te la ricordo 3 settimane prima." },

    { k: "closeDate", l: "Decisione attesa entro", t: "date" },

function contactOpts() { return [["", "— Nessuno —"], ...all("contacts").sort((a, b) => a.name.localeCompare(b.name, "it")).map(c => [c.id, c.name])]; }

function openForm(col, id, preset) {
  const sch = SCHEMA[col]; const rec = col === "settings" ? cfg() : id ? state[col].get(id) : null;
  const ro = !canWrite;
  const val = f => rec ? (rec[f.k] ?? "") : preset && f.k in preset ? preset[f.k] : (typeof f.def === "function" ? f.def() : f.def ?? "");
  const fields = sch.fields.map(f => {
    const v = val(f); const fid = `f_${col}_${f.k}`; const dis = ro ? "disabled" : "";
    let input;
    if (f.t === "select") input = `<select id="${fid}" name="${f.k}" ${dis}>${f.opts().map(([ov, ol]) => `<option value="${esc(ov)}" ${String(v) === String(ov) ? "selected" : ""}>${esc(ol)}</option>`).join("")}</select>`;
    else if (f.t === "textarea") input = `<textarea id="${fid}" name="${f.k}" ${dis}>${esc(v)}</textarea>`;
    else if (f.t === "list") input = `<input id="${fid}" name="${f.k}" list="${fid}_l" value="${esc(v)}" ${dis}><datalist id="${fid}_l">${f.opts().map(o => `<option value="${esc(o)}">`).join("")}</datalist>`;
    else input = `<input id="${fid}" name="${f.k}" type="${f.t}" ${f.t === "number" ? 'step="0.01" min="0" inputmode="decimal"' : ""} value="${esc(v)}" ${f.req ? "required" : ""} ${dis}>`;
    return `<div class="field ${f.wide ? "wide" : ""}"><label for="${fid}">${f.l}${f.req ? " *" : ""}</label>${input}${f.help ? `<span class="help">${f.help}</span>` : ""}</div>`;
  }).join("");
  let related = "";
  if (col === "contacts" && id) {
    const ds = all("deals").filter(d => d.contactId === id), os = all("orders").filter(o => o.contactId === id), ts = all("transactions").filter(t => t.contactId === id);
    if (ds.length || os.length || ts.length) related = `<div class="related"><span class="label">Storia con la bottega</span>
      ${ds.map(d => `<div>Richiesta · ${esc(d.title)} · <span class="num">${eur.format(n(d.value))}</span> · ${dstage(d.stage).label}</div>`).join("")}
      ${os.map(o => `<div>Commessa · ${esc(o.title)} · <span class="num">${eur.format(n(o.price))}</span> · ${ostage(o.stage).label}</div>`).join("")}
      ${ts.map(t => `<div>${fmtDay(t.date)} · ${esc(t.description)} · <span class="num">${t.type === "entrata" ? "+" : "−"}${eur.format(n(t.amount))}</span></div>`).join("")}</div>`;
  }
  if (col === "orders" && id) {
    const e = orderEconomics(rec);
    related = `<div class="related"><span class="label">Conto della commessa</span>
      <div>Costo reale finora: <span class="num">${eur2.format(e.cost)}</span> (materiali + ${qty.format(n(rec.hoursDone))} h × ${eur.format(cfg().rate)})</div>
      <div>Margine reale: <span class="num ${e.margin < 0 ? "neg-t" : "pos-t"}">${eur2.format(e.margin)}</span> ${marginPill(e.pct)}</div>
      <div>Ancora da incassare: <span class="num">${rec.settled ? "saldato" : eur2.format(e.due)}</span></div></div>`;
  }
  const form = document.getElementById("dlgForm");
  const heading = col === "settings" ? "Impostazioni bottega" : ro ? cap(sch.title) : (id ? "Modifica " : "Nuova ").replace("Nuova ", ["cliente", "movimento", "materiale"].includes(sch.title) ? "Nuovo " : "Nuova ") + sch.title;
  form.innerHTML = `<h2>${heading}</h2>
    <div class="fields">${fields}</div>${related}
    <p id="formErr" class="neg-t" hidden></p>
    <div class="dlg-foot"><div>${id && !ro && col !== "settings" ? `<button type="button" class="btn danger" id="delBtn">Elimina</button>` : ""}</div>
    <div class="actions"><button type="button" class="btn" id="cancelBtn">${ro ? "Chiudi" : "Annulla"}</button>${ro ? "" : `<button type="submit" class="btn primary">${id ? "Salva modifiche" : "Aggiungi"}</button>`}</div></div>`;
  const dlg = document.getElementById("dlg");
  const showErr = msg => { const e = document.getElementById("formErr"); e.textContent = msg; e.hidden = false; };
  form.onsubmit = async ev => {
    ev.preventDefault();
    const data = {};
    for (const f of sch.fields) {
      let v = form.elements[f.k].value.trim();
      if (f.req && !v) { showErr(`Compila il campo «${f.l}».`); form.elements[f.k].focus(); return; }
      if (f.t === "number") { v = v === "" ? 0 : parseFloat(v.replace(",", ".")); if (!isFinite(v) || v < 0) { showErr(`«${f.l}» deve essere un numero positivo.`); return; } }
      data[f.k] = v;
    }
    if (rec && rec.esempio) data.esempio = false;
    let ok;
    if (col === "settings") ok = await write(() => store.set("settings", "bottega", { ...(state.settings.get("bottega") || {}), ...data }), "Impostazioni salvate");
    else if (id) ok = await write(() => store.update(col, id, data), "Modifiche salvate");
    else ok = await write(() => store.add(col, { ...data, ...(preset && preset._extra || {}), createdAt: new Date().toISOString() }), `${cap(sch.title)} aggiunt${["cliente", "movimento", "materiale"].includes(sch.title) ? "o" : "a"}`);
    if (ok) dlg.close();
  };
  document.getElementById("cancelBtn").onclick = () => dlg.close();
  const del = document.getElementById("delBtn");
  if (del) del.onclick = async () => {
    if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "Conferma eliminazione"; return; }
    if (await write(() => store.remove(col, id), "Eliminato")) dlg.close();
  };
  dlg.showModal();
}

/* ---------- Azioni ---------- */
async function toLab(dealId) {
  const d = state.deals.get(dealId); if (!d) return;
  const order = { title: d.title, contactId: d.contactId || "", stage: "coda", price: n(d.value), deposit: 0, dueDate: "", materialsCost: n(d.materialsCost), hoursEst: n(d.hoursEst), hoursDone: 0, notes: d.notes || "", dealId, createdAt: new Date().toISOString() };
  let ref;
  if (!await write(async () => { ref = await store.add("orders", order); })) return;
  await write(() => store.update("deals", dealId, { orderId: ref && ref.id || "si" }), "Commessa aperta in laboratorio");
}
async function settle(orderId) {
  const o = state.orders.get(orderId); if (!o) return;
  const due = orderEconomics(o).due;
  if (!await write(() => store.add("transactions", { description: `Saldo · ${o.title}`, type: "entrata", amount: due, date: todayISO(), status: "pagato", category: "Vendite su misura", contactId: o.contactId || "", createdAt: new Date().toISOString() }))) return;
  await write(() => store.update("orders", orderId, { settled: true, paidBalance: due }), `Saldo di ${eur.format(due)} registrato in cassa`);
}

document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-new],[data-markpaid],[data-cstatus],[data-ftype],[data-tolab],[data-settle],[data-hours],[data-stock],[data-qdel],[data-settings],#clearExamples,#qAdd,#qReset,#qSave,#qDefaults,[data-edit]");
  if (!t) return;
  if (t.dataset.new) return openForm(t.dataset.new);
  if (t.dataset.settings) return openForm("settings", "bottega");
  if (t.dataset.markpaid) return write(() => store.update("transactions", t.dataset.markpaid, { status: "pagato" }), "Segnato come pagato");
  if (t.dataset.cstatus) { ui.contactStatus = t.dataset.cstatus; return render(); }
  if (t.dataset.ftype) { ui.finType = t.dataset.ftype; return render(); }
  if (t.dataset.tolab) return toLab(t.dataset.tolab);
  if (t.dataset.settle) return settle(t.dataset.settle);
  if (t.dataset.hours) { const o = state.orders.get(t.dataset.hours); return o && write(() => store.update("orders", t.dataset.hours, { hoursDone: n(o.hoursDone) + n(t.dataset.delta) }), `${qty.format(n(o.hoursDone) + 1)} ore segnate`); }
  if (t.dataset.stock) { const m = state.materials.get(t.dataset.stock); return m && write(() => store.update("materials", t.dataset.stock, { qty: Math.max(0, n(m.qty) + n(t.dataset.delta)) })); }
  if (t.dataset.qdel) { ui.quote.rows.splice(+t.dataset.qdel, 1); if (!ui.quote.rows.length) ui.quote.rows.push({ mat: "", q: 1 }); return render(); }
  if (t.id === "qAdd") { ui.quote.rows.push({ mat: "", q: 1 }); return render(); }
  if (t.id === "qReset") { ui.quote = freshQuote(); return render(); }
  if (t.id === "qDefaults") { const q = ui.quote; return write(() => store.set("settings", "bottega", { ...(state.settings.get("bottega") || {}), rate: n(q.rate), overhead: n(q.overhead), margin: n(q.margin), vat: n(q.vat) }), "Tariffe salvate come predefinite"); }
  if (t.id === "qSave") {
    const q = ui.quote, r = quoteCalc(q);
    if (!q.title.trim()) { toast("Dai un nome al lavoro prima di creare la richiesta."); document.getElementById("q_title").focus(); return; }
    const ok = await write(() => store.add("deals", { title: q.title.trim(), contactId: q.contactId, value: Math.round(r.net), stage: "preventivo", closeDate: "", hoursEst: n(q.hours), materialsCost: Math.round(r.mats * 100) / 100, notes: `Preventivo: netto ${eur2.format(r.net)}, IVA inclusa ${eur2.format(r.total)}. Costo pieno ${eur2.format(r.cost)}.`, createdAt: new Date().toISOString() }), "Richiesta creata in «Preventivo inviato»");
    if (ok) { ui.quote = freshQuote(); location.hash = "richieste"; }
    return;
  }
  if (t.id === "clearExamples") {
    if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Conferma: elimina gli esempi"; return; }
    for (const col of DATA_COLS) for (const r of all(col).filter(x => x.esempio)) if (!await write(() => store.remove(col, r.id))) return;
    return toast("Esempi rimossi");
  }
  if (t.dataset.edit) return openForm(t.dataset.edit, t.dataset.id);
});
function onQuoteInput(el) {
  const q = ui.quote; if (!q) return false;
  if (el.dataset.q) { q[el.dataset.q] = el.type === "number" ? el.value : el.value; }
  else if (el.dataset.qrow != null) {
    const i = +el.dataset.qrow; q.rows[i][el.dataset.k] = el.value;
    const m = state.materials.get(q.rows[i].mat); const line = document.getElementById(`q_line_${i}`);
    if (line) line.textContent = m ? eur2.format(n(m.cost) * n(q.rows[i].q)) : "—";
  } else return false;
  const rc = document.getElementById("receipt"); if (rc) rc.innerHTML = receiptHTML();
  return true;
}
document.addEventListener("input", ev => {
  if (ev.target.id === "cq") { ui.contactQuery = ev.target.value; render(); return; }
  onQuoteInput(ev.target);
});
document.addEventListener("change", ev => {
  if (ev.target.id === "fm") { ui.finMonth = ev.target.value; render(); return; }
  onQuoteInput(ev.target);
});

let drag = null;
document.addEventListener("dragstart", ev => {
  const c = ev.target.closest && ev.target.closest(".card"); if (!c || !canWrite) return;
  drag = { id: c.dataset.id, col: c.dataset.edit }; c.classList.add("drag"); ev.dataTransfer.effectAllowed = "move"; ev.dataTransfer.setData("text/plain", drag.id);
});
document.addEventListener("dragend", () => { drag = null; document.querySelectorAll(".drag,.over").forEach(e => e.classList.remove("drag", "over")); });
document.addEventListener("dragover", ev => {
  const col = ev.target.closest && ev.target.closest(".col"); if (!col || !drag) return;
  ev.preventDefault(); document.querySelectorAll(".col.over").forEach(e => e !== col && e.classList.remove("over")); col.classList.add("over");
});
document.addEventListener("drop", ev => {
  const col = ev.target.closest && ev.target.closest(".col"); if (!col || !drag) return;
  ev.preventDefault();
  const { id, col: c } = drag, stage = col.dataset.stage, rec = state[c].get(id);
  if (rec && rec.stage !== stage) {
    const label = (c === "deals" ? DSTAGE : OSTAGE)[stage].label;
    write(() => store.update(c, id, { stage }), `Spostata in «${label}»`);
  }
});

function route() {
  const h = location.hash.slice(1);
  view = h in VIEWS ? h : "panoramica";
  render();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------- Avvio ---------- */
async function boot() {
  route();
  let db = null, user = null;
  if (window.claude && typeof window.claude.use === "function") {
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) {}
  }
  if (user && db) { try { if (await user.can("data.write") === false) canWrite = false; } catch (e) {} }
  store = db ? dbStore(db) : localStore();
  document.getElementById("modeDot").classList.toggle("on", !!db);
  document.getElementById("modeText").textContent = db ? (canWrite ? "Dati sincronizzati" : "Sola lettura") : "Demo: le modifiche restano in questo browser";
  store.start();
}
boot();
</script>
